.title { position: relative; }

/* ---------- portada ---------- */

const isUn = f => !!UN[f.t];

function str(f, top) {
  switch (f.t) {
    case 'atom':
      if (f.p === '=') return f.args[0] + '=' + f.args[1];
      return f.p + f.args.join('');
    case 'not': return '¬' + str(f.a, false);
    case 'all': return '∀' + f.v + str(f.a, false);
    case 'ex': return '∃' + f.v + str(f.a, false);
    default: {
      if (UN[f.t]) return UN[f.t] + str(f.a, false);
      const s = str(f.a, false) + (SHOW[f.t] || BIN[f.t]) + str(f.b, false);

const TENSE = [['[F]', 'G'], ['⟨F⟩', 'F'], ['<F>', 'F'], ['[P]', 'H'], ['⟨P⟩', 'P'], ['<P>', 'P']];

  switch (f.t) {
    case 'atom': return Atom(f.p, f.args.map(a => (a === v ? t : a)));
    case 'not': return Not(subst(f.a, v, t));
    case 'all': case 'ex': return f.v === v ? f : Qf(f.t, f.v, subst(f.a, v, t));

  if (f.t === 'not') return Not(renameConst(f.a, c, d));

def('S5', 'S5 = K + reflexiva, simétrica y transitiva', { W: 1, md: 'K', R: 'ρστ' });
def('CK', 'K de dominio constante', { W: 1, md: 'K', fo: 'cl' });
def('CT', 'T de dominio constante', { W: 1, md: 'K', fo: 'cl', R: 'ρ' });
def('CS4', 'S4 de dominio constante', { W: 1, md: 'K', fo: 'cl', R: 'ρτ' });
def('CS5', 'S5 de dominio constante', { W: 1, md: 'U', fo: 'cl' });
def('I', 'Intuicionista', { W: 1, sg: 1, int: 1, R: 'ρτ' });
def('IQ', 'Intuicionista de primer orden', { W: 1, sg: 1, int: 1, R: 'ρτ', fo: 'int' });
def('LP', 'LP (lógica de la paradoja)', { sg: 1, neg: 'fde', imp: 'def', cl: 'lp' });
def('QLP', 'LP de primer orden', { sg: 1, neg: 'fde', imp: 'def', fo: 'cl', cl: 'lp' });

/* ================= nodos ================= */
const F = (f, w, s) => ({ k: 'f', f, w: w == null ? null : String(w), s: s || '' });
const Rl = (a, b, A) => ({ k: 'r', a: String(a), b: String(b), A: A || null });
const R3 = (a, b, c) => ({ k: 'r3', a: String(a), b: String(b), c: String(c) });
function keyOf(n) {
  if (n.k === 'r') return 'r|' + n.a + '|' + n.b + '|' + (n.A ? str(n.A) : '');
  if (n.k === 'r3') return 't|' + n.a + '|' + n.b + '|' + n.c;
  return 'f|' + n.s + '|' + (n.w == null ? '' : n.w) + '|' + str(n.f);
}
const star = x => (x.endsWith('#') ? x.slice(0, -1) : x + '#');
const base = x => (x.endsWith('#') ? x.slice(0, -1) : x);

/* ================= contexto de una rama ================= */
function ctxOf(path, sys) {
  const keys = new Set(), worlds = [], ws = new Set(), consts = new Set(), descs = new Set(), rel = [], rel3 = [];
  const addW = w => { if (w != null && !ws.has(w)) { ws.add(w); worlds.push(w); } };
  path.forEach(n => {
    keys.add(n.key);
    if (n.k === 'r') { addW(n.a); addW(n.b); rel.push(n); }
    else if (n.k === 'r3') { addW(n.a); addW(n.b); addW(n.c); rel3.push(n); }
    else { addW(n.w); L.constsOf(n.f, consts); L.descsOf(n.f, descs); }
  });
  if (sys.W && !ws.has('0')) addW('0');
  return {
    path, keys, worlds, consts, descs, rel, rel3,
    has: spec => keys.has(keyOf(spec)),
    next() { let m = -1; worlds.forEach(w => { const k = parseInt(w, 10); if (k > m) m = k; }); return String(m + 1); },
    fresh() { return L.freshConst(consts); },
    boxed: w => path.some(n => n.k === 'f' && n.w === w && !n.s && n.f.t === 'box')
  };
}

/* ================= reglas de una línea ================= */
/* cada instancia: { r: nombre, alts: [[nodos]] } o, si crea un mundo o un nombre nuevo,
   { r, fresh: true, make: B => alts, sat: B => ¿ya hay testigo? } */
const one = (r, ...ns) => ({ r, alts: [ns] });
const two = (r, a, b) => ({ r, alts: [a, b] });
function expand(sys, n, B) {
  if (n.k !== 'f') return [];
  return sys.sg ? expandS(sys, n, B) : expandU(sys, n, B);
}
const inst = (A, v, c) => subst(A, v, c);

function quantU(sys, n, B, f, w, neg) {
  const out = [];
  if (f.t === 'all') {   // ∀xA: un ejemplar por cada nombre de la rama (o uno nuevo si no hay)
    if (sys.fo === 'free' || sys.fo === 'var') {   // libre (13.3.1) y dominio variable (15.4.1): o bien ¬Ea, o bien A(a)
      if (B.consts.size) [...B.consts].sort().forEach(c => out.push(two('∀', [F(Not(Ex(c)), w)], [F(inst(f.a, f.v, c), w)])));
      else out.push({ r: '∀', fresh: true, make: X => { const c = X.fresh(); return [[F(Not(Ex(c)), w)], [F(inst(f.a, f.v, c), w)]]; }, sat: X => X.consts.size > 0 });
    } else if (B.consts.size) [...B.consts].sort().forEach(c => out.push(one('∀', F(inst(f.a, f.v, c), w))));
    else out.push({ r: '∀', fresh: true, make: X => [[F(inst(f.a, f.v, X.fresh()), w)]], sat: X => X.consts.size > 0 });
  }
  if (f.t === 'ex') {
    const ex = sys.fo === 'free' || sys.fo === 'var';
    out.push({ r: '∃', fresh: true, make: X => { const c = X.fresh(); return [ex ? [F(Ex(c), w), F(inst(f.a, f.v, c), w)] : [F(inst(f.a, f.v, c), w)]]; },
      sat: X => [...X.consts].some(c => X.has(F(inst(f.a, f.v, c), w)) && (!ex || X.has(F(Ex(c), w)))) });
  }
  return out;
}

function expandU(sys, n, B) {
  const f = n.f, w = n.w;
  const at0 = w == null || w === '0';
  const modOK = sys.nn !== 'L' || at0;     // en L las reglas modales solo valen en el mundo 0
  const rel = (a, A) => B.rel.filter(r => r.a === a && (A ? r.A && L.eq(r.A, A) : !r.A));
  const relTo = b => B.rel.filter(r => r.b === b && !r.A);
  if (f.t === 'not') {
    const g = f.a;
    switch (g.t) {
      case 'not': return [one('¬¬', F(g.a, w))];
      case 'and': return [two('¬∧', [F(Not(g.a), w)], [F(Not(g.b), w)])];
      case 'or': return [one('¬∨', F(Not(g.a), w), F(Not(g.b), w))];
      case 'imp': return [one('¬→', F(g.a, w), F(Not(g.b), w))];
      case 'iff': return [two('¬↔', [F(g.a, w), F(Not(g.b), w)], [F(Not(g.a), w), F(g.b, w)])];
      case 'str': return [one('¬⥽', F(Not(Un('box', Bin('imp', g.a, g.b))), w))];
      case 'box': return modOK ? [one('¬□', F(Un('dia', Not(g.a)), w))] : [];
      case 'dia': return modOK ? [one('¬◇', F(Un('box', Not(g.a)), w))] : [];
      case 'G': return [one('¬[F]', F(Un('F', Not(g.a)), w))];
      case 'F': return [one('¬⟨F⟩', F(Un('G', Not(g.a)), w))];
      case 'H': return [one('¬[P]', F(Un('P', Not(g.a)), w))];
      case 'P': return [one('¬⟨P⟩', F(Un('H', Not(g.a)), w))];
      case 'all': return [one('¬∀', F(Qf('ex', g.v, Not(g.a)), w))];
      case 'ex': return [one('¬∃', F(Qf('all', g.v, Not(g.a)), w))];
      case 'cnd': {
        const plus = sys.cond === 'C+';
        return [{ r: '¬>', fresh: true,
          make: X => { const j = X.next(); return [[Rl(w, j, g.a), ...(plus ? [F(g.a, j)] : []), F(Not(g.b), j)]]; },
          sat: X => rel(w, g.a).some(r => X.has(F(Not(g.b), r.b))) }];
      }
      default: return [];
    }
  }
  switch (f.t) {
    case 'and': return [one('∧', F(f.a, w), F(f.b, w))];
    case 'or': return [two('∨', [F(f.a, w)], [F(f.b, w)])];
    case 'imp': return [two('→', [F(Not(f.a), w)], [F(f.b, w)])];
    case 'iff': return [two('↔', [F(f.a, w), F(f.b, w)], [F(Not(f.a), w), F(Not(f.b), w)])];
    case 'str': return [one('⥽', F(Un('box', Bin('imp', f.a, f.b)), w))];
    case 'box':
      if (!modOK) return [];
      if (sys.md === 'U') return B.worlds.map(j => one('□', F(f.a, j)));
      return rel(w).map(r => one('□', F(f.a, r.b)));
    case 'dia': {
      if (!modOK) return [];
      if (sys.nn === 'N' && !at0 && !B.boxed(w)) return [];   // mundo no normal mientras nada lo obligue a ser normal
      if (sys.md === 'U') return [{ r: '◇', fresh: true, make: X => [[F(f.a, X.next())]], sat: X => X.worlds.some(j => X.has(F(f.a, j))) }];
      return [{ r: '◇', fresh: true, make: X => { const j = X.next(); return [[Rl(w, j), F(f.a, j), ...(sys.gl ? [F(Un('box', Not(f.a)), j)] : [])]]; }, sat: X => rel(w).some(r => X.has(F(f.a, r.b))) }];
    }
    case 'G': return rel(w).map(r => one('[F]', F(f.a, r.b)));
    case 'H': return relTo(w).map(r => one('[P]', F(f.a, r.a)));
    case 'F': return [{ r: '⟨F⟩', fresh: true, make: X => { const j = X.next(); return [[Rl(w, j), F(f.a, j)]]; }, sat: X => rel(w).some(r => X.has(F(f.a, r.b))) }];
    case 'P': return [{ r: '⟨P⟩', fresh: true, make: X => { const j = X.next(); return [[Rl(j, w), F(f.a, j)]]; }, sat: X => relTo(w).some(r => X.has(F(f.a, r.a))) }];
    case 'cnd': return rel(w, f.a).map(r => one('>', F(f.b, r.b)));
    case 'all': case 'ex': return sys.fo ? quantU(sys, n, B, f, w) : [];
    default: return [];
  }
}

/* nodos con signo: FDE y compañía (capítulos 6–11) */
function expandS(sys, n, B) {
  const f = n.f, x = n.w, s = n.s, P = '+', M = '-';
  const S = (g, sg, w) => F(g, w === undefined ? x : w, sg);
  const pos = s === P;
  const worldsAll = () => {   // en las lógicas con estrella, cada j viene con su j#
    if (sys.neg !== 'star') return B.worlds;
    const out = new Set();
    B.worlds.forEach(w => { out.add(base(w)); out.add(base(w) + '#'); });
    return [...out];
  };
  const normalHere = !(sys.arr === 'N4' || sys.arr === 'N*') || x === '0';
  if (f.t === 'not') {
    const g = f.a;
    if (sys.int) {   // negación intuicionista: ¬A,+i obliga en todo mundo accesible; ¬A,−i abre uno
      if (pos) return B.rel.filter(r => r.a === x && !r.A).map(r => one('¬+', S(g, M, r.b)));
      return [{ r: '¬−', fresh: true, make: X => { const j = X.next(); return [[Rl(x, j), S(g, P, j)]]; }, sat: X => B.rel.some(r => r.a === x && X.has(S(g, P, r.b))) }];
    }
    if (sys.neg === 'star') return [one(pos ? '¬+' : '¬−', S(g, pos ? M : P, x == null ? null : star(x)))];
    switch (g.t) {
      case 'not': return [one('¬¬', S(g.a, s))];
      case 'and': return [one('¬∧', S(Bin('or', Not(g.a), Not(g.b)), s))];
      case 'or': return [one('¬∨', S(Bin('and', Not(g.a), Not(g.b)), s))];
      case 'imp':
        if (sys.imp === 'def') return [one('¬→', S(Not(Bin('or', Not(g.a), g.b)), s))];
        return pos ? [one('¬⊃+', S(g.a, P), S(Not(g.b), P))] : [two('¬⊃−', [S(g.a, M)], [S(Not(g.b), M)])];
      case 'iff': return [one('¬↔', S(Not(Bin('and', Bin('imp', g.a, g.b), Bin('imp', g.b, g.a))), s))];
      case 'all': return sys.fo ? [one('¬∀', S(Qf('ex', g.v, Not(g.a)), s))] : [];
      case 'ex': return sys.fo ? [one('¬∃', S(Qf('all', g.v, Not(g.a)), s))] : [];
      case 'box': return [one('¬□', S(Un('dia', Not(g.a)), s))];
      case 'dia': return [one('¬◇', S(Un('box', Not(g.a)), s))];
      case 'ico':
        if (sys.cn === 'W') return [one(pos ? '¬→+' : '¬→−', S(Bin('ico', g.a, Not(g.b)), s))];
        return pos ? [one('¬→+', S(g.a, P), S(Not(g.b), P))] : [two('¬→−', [S(g.a, M)], [S(Not(g.b), M)])];
      case 'arr':
        if (!normalHere) return [];
        if (pos) return [{ r: '¬→+', fresh: true, make: X => { const j = X.next(); return [[S(g.a, P, j), S(Not(g.b), P, j)]]; }, sat: X => X.worlds.some(j => X.has(S(g.a, P, j)) && X.has(S(Not(g.b), P, j))) }];
        return B.worlds.map(j => two('¬→−', [S(g.a, M, j)], [S(Not(g.b), M, j)]));
      default: return [];
    }
  }
  switch (f.t) {
    case 'and': return pos ? [one('∧+', S(f.a, P), S(f.b, P))] : [two('∧−', [S(f.a, M)], [S(f.b, M)])];
    case 'or': return pos ? [two('∨+', [S(f.a, P)], [S(f.b, P)])] : [one('∨−', S(f.a, M), S(f.b, M))];
    case 'iff': return [one('↔', S(Bin('and', Bin('imp', f.a, f.b), Bin('imp', f.b, f.a)), s))];
    case 'imp':
      if (sys.imp === 'def') return [one('→', S(Bin('or', Not(f.a), f.b), s))];
      if (sys.imp === 'L3') return pos
        ? [{ r: '⊃+', alts: [[S(Not(f.a), P)], [S(f.b, P)], [S(Bin('or', f.a, Not(f.a)), M), S(Bin('or', f.b, Not(f.b)), M)]] }]
        : [two('⊃−', [S(Not(f.a), M), S(f.b, M), S(f.a, P)], [S(Not(f.a), M), S(f.b, M), S(Not(f.b), P)])];
      return pos   // RM3
        ? [{ r: '⊃+', alts: [[S(f.a, M)], [S(Not(f.b), M)], [S(Bin('and', f.a, Not(f.a)), P), S(Bin('and', f.b, Not(f.b)), P)]] }]
        : [two('⊃−', [S(f.a, P), S(Not(f.b), P), S(Not(f.a), M)], [S(f.a, P), S(Not(f.b), P), S(f.b, M)])];
    case 'ex': case 'all': {
      if (sys.fo === 'cl' || sys.fo === 'free') {   // FDE y compañía de primer orden (22.3.1, 22.4.3)
        const I = c => inst(f.a, f.v, c), free = sys.fo === 'free';
        const every = (f.t === 'all') === pos, sg = pos ? P : M, name = (f.t === 'all' ? '∀' : '∃') + (pos ? '+' : '−');
        if (every) {
          const mk = c => (free ? two(name, [S(Ex(c), M)], [S(I(c), sg)]) : one(name, S(I(c), sg)));
          if (B.consts.size) return [...B.consts].sort().map(mk);
          return [{ r: name, fresh: true, make: X => { const c = X.fresh(); return free ? [[S(Ex(c), M)], [S(I(c), sg)]] : [[S(I(c), sg)]]; }, sat: X => X.consts.size > 0 }];
        }
        return [{ r: name, fresh: true, make: X => { const c = X.fresh(); return [[...(free ? [S(Ex(c), P)] : []), S(I(c), sg)]]; },
          sat: X => [...X.consts].some(c => X.has(S(I(c), sg)) && (!free || X.has(S(Ex(c), P)))) }];
      }
      if (sys.fo !== 'int') return [];
      const I = c => inst(f.a, f.v, c);
      if (f.t === 'ex' && pos) return [{ r: '∃+', fresh: true, make: X => { const c = X.fresh(); return [[S(Ex(c), P), S(I(c), P)]]; },
        sat: X => [...X.consts].some(c => X.has(S(Ex(c), P)) && X.has(S(I(c), P))) }];
      if (f.t === 'ex') return [...B.consts].sort().map(c => two('∃−', [S(Ex(c), M)], [S(I(c), M)]));
      if (!pos) return [{ r: '∀−', fresh: true, make: X => { const j = X.next(), c = X.fresh(); return [[Rl(x, j), S(Ex(c), P, j), S(I(c), M, j)]]; },
        sat: X => B.rel.some(r => r.a === x && [...X.consts].some(c => X.has(S(Ex(c), P, r.b)) && X.has(S(I(c), M, r.b)))) }];
      const out = [];
      B.rel.filter(r => r.a === x && !r.A).forEach(r => [...B.consts].sort().forEach(c => out.push(two('∀+', [S(Ex(c), M, r.b)], [S(I(c), P, r.b)]))));
      return out;
    }
    case 'ico':   // condicional intuicionista
      if (pos) return B.rel.filter(r => r.a === x && !r.A).map(r => two('→+', [S(f.a, M, r.b)], [S(f.b, P, r.b)]));
      return [{ r: '→−', fresh: true, make: X => { const j = X.next(); return [[Rl(x, j), S(f.a, P, j), S(f.b, M, j)]]; },
        sat: X => B.rel.some(r => r.a === x && X.has(S(f.a, P, r.b)) && X.has(S(f.b, M, r.b))) }];
    case 'arr':
      if (sys.tern) {   // relevantes: relación ternaria; en 0 vale r0xx para todo x (regla de normalidad, implícita)
        if (pos) {
          if (x === '0') return worldsAll().map(j => two('→+', [S(f.a, M, j)], [S(f.b, P, j)]));
          return B.rel3.filter(t => t.a === x).map(t => two('→+', [S(f.a, M, t.b)], [S(f.b, P, t.c)]));
        }
        if (x === '0') return [{ r: '→−', fresh: true, make: X => { const j = X.next(); return [[S(f.a, P, j), S(f.b, M, j)]]; },
          sat: X => worldsAll().some(j => X.has(S(f.a, P, j)) && X.has(S(f.b, M, j))) }];
        return [{ r: '→−', fresh: true, make: X => { const j = X.next(), k = String(+j + 1); return [[R3(x, j, k), S(f.a, P, j), S(f.b, M, k)]]; },
          sat: X => X.rel3.some(t => t.a === x && X.has(S(f.a, P, t.b)) && X.has(S(f.b, M, t.c))) }];
      }
      if (!normalHere) return [];
      if (pos) return worldsAll().map(j => two('→+', [S(f.a, M, j)], [S(f.b, P, j)]));
      return [{ r: '→−', fresh: true, make: X => { const j = X.next(); return [[S(f.a, P, j), S(f.b, M, j)]]; },
        sat: X => X.worlds.some(j => X.has(S(f.a, P, j)) && X.has(S(f.b, M, j))) }];
    case 'box': case 'dia': {   // modales de muchos valores (11a): + y − como □/◇ y sus duales
      const rel = B.rel.filter(t => t.a === x && !t.A);
      const every = (f.t === 'box') === pos;   // □A,+ y ◇A,− miran a todos los mundos accesibles
      const sg = pos ? P : M, name = (f.t === 'box' ? '□' : '◇') + (pos ? '+' : '−');
      if (every) return rel.map(t => one(name, S(f.a, sg, t.b)));
      return [{ r: name, fresh: true, make: X => { const j = X.next(); return [[Rl(x, j), S(f.a, sg, j)]]; }, sat: X => rel.some(t => X.has(S(f.a, sg, t.b))) }];
    }
    case 'cnd': {   // > sobre una lógica relevante (CB, CB⁺)
      const rel = B.rel.filter(t => t.a === x && t.A && L.eq(t.A, f.a));
      if (pos) return rel.map(t => one('>+', S(f.b, P, t.b)));
      const plus = sys.cond === 'C+' && x === '0';
      return [{ r: '>−', fresh: true, make: X => { const j = X.next(); return [[Rl(x, j, f.a), ...(plus ? [S(f.a, P, j)] : []), S(f.b, M, j)]]; },
        sat: X => rel.some(t => X.has(S(f.b, M, t.b))) }];
    }
    default: return [];
  }
}

const instKey = I => I.alts.map(a => a.map(keyOf).join('&')).join('||');

/* ================= reglas estructurales ================= */
const STRUCT = {
  'ρ': { name: 'Reflexividad', desc: 'Para cada mundo i de la rama, añade iri.',
    inst: (sys, B) => B.worlds.filter(w => !w.endsWith('#')).map(i => one('ρ', Rl(i, i))) },
  'σ': { name: 'Simetría', desc: 'De irj pasa a jri.',
    inst: (sys, B) => B.rel.filter(r => !r.A).map(r => one('σ', Rl(r.b, r.a))) },
  'τ': { name: 'Transitividad', desc: 'De irj y jrk pasa a irk.',
    inst: (sys, B) => { const out = []; B.rel.forEach(r => { if (!r.A) B.rel.forEach(q => { if (!q.A && q.a === r.b) out.push(one('τ', Rl(r.a, q.b))); }); }); return out; } },
  'η': { name: 'Extensibilidad', desc: 'Si el mundo i no ve a ninguno, crea un mundo nuevo j con irj.', fresh: 1,
    inst: (sys, B) => B.worlds.map(i => ({ r: 'η', fresh: true, make: X => [[Rl(i, X.next())]], sat: X => X.rel.some(r => r.a === i && !r.A) })) },
  'her': { name: 'Herencia', desc: 'Lo que vale en un mundo sigue valiendo en los que ve: de p,+i e irj pasa a p,+j (solo letras).',
    inst: (sys, B) => {
      const out = [];
      B.path.forEach(n => {
        if (n.k !== 'f' || n.s !== '+') return;
        const lit = n.f.t === 'atom' || ((sys.cn || sys.pers) && n.f.t === 'not' && n.f.a.t === 'atom');
        if (lit) B.rel.forEach(r => { if (r.a === n.w && r.b !== n.w) out.push(one('her', F(n.f, r.b, '+'))); });
      });
      return out;
    } },
  'C8': { name: 'Condición C8', desc: 'De rxyz pasa a rxz̄ȳ (x̄ es la pareja estrella de x).',
    inst: (sys, B) => B.rel3.map(t => one('C8', R3(t.a, star(t.c), star(t.b)))) },
  'CB+': { name: 'Centrado en 0', desc: 'Para cada antecedente A de un condicional {>}: o bien A,−0, o bien A,+0 y 0 r_A 0.',
    inst: (sys, B) => {
      const ants = new Map();

    T('La sintaxis se vuelve aritmética', [
      { say: 'Segunda idea: como las fórmulas son números, las propiedades de las fórmulas son propiedades de números. «Ser una fórmula bien formada», «ser un axioma», «seguirse por modus ponens» se convierten en relaciones aritméticas entre códigos.' },

      { say: 'De ahí sale una propiedad que usaremos: si T demuestra {A}, entonces T demuestra {Prov(⌜A⌝)}. Basta tomar el código de la prueba y comprobarlo. En general, T demuestra toda oración {Σ₁} verdadera.' }

      { say: 'El rodeo es la <b>diagonalización</b>. Toma una fórmula con una variable libre, {B(x)}, y sustituye la variable por el numeral del código de la propia fórmula: obtienes {B(⌜B⌝)}. Esta operación sobre códigos es mecánica, así que T puede hablar de ella.' },
      { say: 'Una versión en castellano, debida a Quine: «da una falsedad cuando va precedida de su propia cita» da una falsedad cuando va precedida de su propia cita. La oración habla de una expresión, y al aplicarle la operación indicada se obtiene la oración misma.' },
      { say: '<b>Lema diagonal</b>: para cualquier fórmula {A(x)} existe una oración {D} tal que T demuestra {D ↔ A(⌜D⌝)}. Es decir, {D} dice de sí misma «tengo la propiedad A». No es magia ni circularidad: es una sustitución bien calculada.', mood: 'neutral' }

    T('La oración de Gödel', [
      { say: 'Ya están todas las piezas. Aplica el lema diagonal a la propiedad «no ser demostrable», {¬Prov(x)}. Obtienes una oración {G} tal que T demuestra {G ↔ ¬Prov(⌜G⌝)}.' },
      { say: '{G} dice: «no soy demostrable en T». Se parece a la paradoja del mentiroso, pero hay una diferencia decisiva: no habla de <i>verdad</i>, sino de <i>demostrabilidad</i>, y esa sí es una noción aritmética. Por eso {G} no es una paradoja: es una oración aritmética perfectamente legítima.' },
      { say: '<b>Primer teorema de incompletud</b>: si T es consistente, efectivamente axiomatizada y contiene la aritmética básica, hay oraciones que T no puede probar ni refutar. {G} es una de ellas. Hay dos caminos para demostrarlo, y vas a recorrer los dos.',

      { say: 'Y entonces {G} es <b>verdadera</b>, porque dice exactamente eso: que no es demostrable. Su negación {¬G} es falsa, así que T, que solo demuestra verdades, tampoco demuestra {¬G}. Conclusión: {G} es verdadera e indecidible en T.' },

    A('Verdadera e indemostrable', 'CL', ['G↔¬D', 'D→G'], 'G∧¬D', {

    T('La prueba sintáctica', [

        fig: table(['Paso', 'Por qué'], [['{T ⊢ G}', 'es el supuesto'], ['{T ⊢ Prov(⌜G⌝)}', 'T comprueba esa prueba'], ['{T ⊢ ¬Prov(⌜G⌝)}', 'por lo que dice {G}'], ['T es inconsistente', 'demuestra una oración y su negación']]) },
      { say: 'Segunda mitad: T no demuestra {¬G}. Aquí Gödel necesitó algo más fuerte, la <b>{ω}-consistencia</b>: T no demuestra «existe un número con la propiedad A» mientras refuta A de cada número concreto, uno por uno.' },

      { say: 'En 1936 J. B. Rosser eliminó esa hipótesis extra con una oración más astuta: «si hay una prueba de mí, hay otra más corta de mi negación». Con ella basta la simple consistencia: toda teoría consistente, efectiva y con aritmética básica es incompleta.' }

    T('Qué dice y qué no dice', [
      { say: 'El teorema se cita mucho y mal. Dice: toda teoría <b>consistente</b>, <b>efectivamente axiomatizada</b> y que contenga la aritmética de Robinson es <b>incompleta</b>. Las tres condiciones hacen falta.',
        fig: table(['Si falta…', 'Ejemplo', 'Resultado'], [['la aritmética', 'la aritmética de Presburger, solo con suma', 'es completa y decidible'], ['la axiomatización efectiva', 'tomar como axiomas todas las verdades de {ℕ}', 'es completa, pero nadie puede revisar sus pruebas'], ['la consistencia', 'una teoría inconsistente', 'lo demuestra todo']]) },
      { say: 'No dice que {G} sea indemostrable «en absoluto». {G} se demuestra en teorías más fuertes, por ejemplo en T más el axioma {G}. Pero esa teoría nueva tiene su propia oración de Gödel. La incompletud no se cura añadiendo axiomas.' },
      { say: 'Tampoco contradice el <b>teorema de completitud</b> que Gödel había probado en 1929. Aquel dice que la <i>lógica</i> es completa: lo que vale en todos los modelos se puede demostrar. Como T no demuestra {G}, hay modelos de T donde {G} es falsa: modelos <b>no estándar</b>, con «números» extraños más allá de los naturales.' },
      { say: 'Un pariente cercano es el teorema de <b>Tarski</b>: la verdad aritmética no es definible en la aritmética. Si hubiera una fórmula {True(x)}, el lema diagonal daría una oración que dice «soy falsa», y esa sí es contradictoria. La demostrabilidad es definible; la verdad, no. Por eso no pueden coincidir.' }

    T('El segundo teorema', [
      { say: 'Queda la pregunta de Hilbert: ¿puede T demostrar su propia consistencia? Primero hay que poder decirlo. «T es consistente» se escribe {Con(T)}: es la oración {¬Prov(⌜0=S0⌝)}, «T no demuestra que cero es uno».' },
      { say: 'Ahora mira la primera mitad de la prueba sintáctica: «si T es consistente, T no demuestra G». Ese razonamiento es tan elemental que puede formalizarse <i>dentro</i> de T. El resultado es que T demuestra {Con(T) → ¬Prov(⌜G⌝)}, o sea, {Con(T) → G}.' },
      { say: '<b>Segundo teorema de incompletud</b>: si T es consistente, T no demuestra {Con(T)}. Porque si la demostrara, por modus ponens demostraría {G}, y el primer teorema lo prohíbe. Ninguna teoría razonable certifica su propia consistencia.' },
      { say: 'Para formalizar el razonamiento bastan tres propiedades de {Prov}, las <b>condiciones de derivabilidad</b>. Si lees {□A} como «T demuestra A», son viejas conocidas del Archipiélago.',
        fig: table(['Condición', 'En símbolos modales'], [['si T demuestra {A}, T demuestra {Prov(⌜A⌝)}', 'de {A} se pasa a {□A}'], ['{Prov} respeta el modus ponens', '{□(A→B)→(□A→□B)}'], ['si algo es demostrable, es demostrable que lo es', '{□A→□□A}']]) },
      { say: 'Así que puedes demostrar los dos teoremas con árboles modales, en el sistema K4: mundos, flechas transitivas, y nada más. Cuidado: aquí no hay flechas reflexivas, la regla de T. Que T demuestre algo no garantiza, <i>dentro de T</i>, que sea verdad. La premisa {□(G↔¬□G)} es el lema diagonal, y {□(P∧¬P)} significa «T demuestra una contradicción», es decir, «T es inconsistente».' }
    ]),
    A('El primer teorema, formalizado', 'K4', ['□(G↔¬□G)'], '□G→□(P∧¬P)', {

    A('El segundo teorema', 'K4', ['□(G↔¬□G)', '□G→□(P∧¬P)', '□(□G→□(P∧¬P))'], '□¬□(P∧¬P)→□(P∧¬P)', { boss: true,

    T('Después de Gödel', [
      { say: 'El argumento del segundo teorema tiene una forma general, el <b>teorema de Löb</b>: si T demuestra «si A es demostrable, entonces A», es que T ya demuestra {A}. En símbolos, {□(□A→A)→□A}. El segundo teorema es el caso en que {A} es {⊥}.' },
      { say: 'Añadir ese principio a K4 da la <b>lógica de la demostrabilidad</b>, GL: la lógica modal exacta de lo que una teoría como PA puede decir sobre sus propias pruebas. En los árboles se nota enseguida: al crear un mundo nuevo para {◇A}, GL le añade {□¬A}, y eso impide cadenas infinitas.' },
      { say: 'En 1936 Alan Turing llegó a la incompletud por otro camino. Ningún programa decide, en general, si otro programa se detiene. Si una teoría fuera completa y correcta sobre esas cuestiones, bastaría buscar pruebas para decidirlo. Incompletud e <b>indecidibilidad</b> son dos caras del mismo fenómeno.' },
      { say: 'La consistencia de PA sí se puede demostrar, pero desde fuera. Gerhard Gentzen lo hizo en 1936 con inducción transfinita hasta el ordinal {ε₀}, un principio que PA no puede justificar. El programa de Hilbert no murió: cambió de forma.', mood: 'neutral' },
      { say: 'También hay oraciones indecidibles «naturales», sin autorreferencia: el teorema de Goodstein no se demuestra en PA, y la hipótesis del continuo no se decide en la teoría de conjuntos usual. La incompletud no es un truco: es un rasgo de la matemática.' }

function typewriter(el) {

        ch.textContent.split(/(\s+)/).forEach(tok => {

          frag.appendChild(word);

  const loops = new Set((D.R || []).filter(([a, b]) => a === b).map(([a]) => a));
  const loopsA = {};
  (D.RA || []).forEach(([a, b, A]) => { if (a === b) (loopsA[a] = loopsA[a] || []).push(A); });
  const lev = new Array(n).fill(-1);
  const r0 = idx[D.root] != null ? idx[D.root] : 0;
  lev[r0] = 0;
  for (let q = [r0]; q.length;) { const a = q.shift(); E.forEach(([x, y]) => { if (x === a && lev[y] < 0) { lev[y] = lev[a] + 1; q.push(y); } }); }
  lev.forEach((l, i) => { if (l < 0) lev[i] = D.star && ids[i].endsWith('#') ? lev[idx[ids[i].slice(0, -1)]] : 1; });
  if (D.star) ids.forEach((w, i) => { if (w.endsWith('#') && idx[w.slice(0, -1)] != null) lev[i] = lev[idx[w.slice(0, -1)]]; });
  const cols = [];
  lev.forEach((l, i) => { (cols[l] = cols[l] || []).push(i); });
  const BW = 136, GX = 70, GY = 18;
  const BH = Math.max(54, ...ids.map(w => 32 + Math.ceil((D.lits[w] || []).join(', ').length / 16) * 18));
  const rows = Math.max(1, ...cols.filter(Boolean).map(c => c.length));
  const nc = cols.length;
  const Wd = nc * (BW + GX) - GX, H = rows * (BH + GY) - GY, pos = [];
  cols.forEach((c, l) => { if (c) c.forEach((i, k) => { pos[i] = { x: l * (BW + GX), y: (H - (c.length * (BH + GY) - GY)) / 2 + k * (BH + GY) }; }); });
  const tip = (x, y, ux, uy) => `<path d="M${x} ${y} L${x - 11 * ux + 6 * uy} ${y - 11 * uy - 6 * ux} L${x - 11 * ux - 6 * uy} ${y - 11 * uy + 6 * ux} z"/>`;
  const seen = new Set();
  let svg = '', labs = '';
  E.forEach(([a, b, A]) => {
    const k = Math.min(a, b) + '-' + Math.max(a, b) + A;
    if (seen.has(k)) return;
    seen.add(k);
    const both = E.some(([x, y, B]) => x === b && y === a && B === A);
    const P = pos[a], Q = pos[b];
    if (!P || !Q) return;
    const ax = P.x + BW / 2, ay = P.y + BH / 2, bx = Q.x + BW / 2, by = Q.y + BH / 2;
    const dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
    const t = Math.min((BW / 2 + 6) / (Math.abs(dx) || 1e-9), (BH / 2 + 6) / (Math.abs(dy) || 1e-9)) * d;
    const x1 = ax + ux * t, y1 = ay + uy * t, x2 = bx - ux * t, y2 = by - uy * t;
    svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>` + tip(x2, y2, ux, uy) + (both ? tip(x1, y1, -ux, -uy) : '');
    if (A) labs += `<span class="elab" style="left:${(x1 + x2) / 2}px;top:${(y1 + y2) / 2}px">${fm(A)}</span>`;
  });
  const boxes = ids.map((w, i) => {
    const t = D.lits[w] || [];
    const loop = loops.has(w) ? `<em>${ico('loop')}</em>` : '';
    const la = loopsA[w] ? `<em class="la">${ico('loop')}<sub>${loopsA[w].map(fm).join(',')}</sub></em>` : '';
    const cls = ['world', w === D.root ? 'root' : '', (D.nn || []).includes(w) ? 'nn' : ''].join(' ');
    return `<div class="${cls}" style="left:${pos[i].x}px;top:${pos[i].y}px;width:${BW}px;height:${BH}px"><b>${esc(D.names[w])}${loop}${la}</b><span>${t.length ? t.map(fm).join(', ') : '–'}</span></div>`;
  }).join('');
  return `<div class="kr-wrap"><div class="kmodel" style="width:${Wd}px;height:${H}px"><svg viewBox="0 0 ${Wd} ${H}" width="${Wd}" height="${H}" aria-hidden="true">${svg}</svg>${boxes}${labs}</div></div>`;
}

/* ----- numeración de Gödel ----- */
const PRIMES = [2, 3, 5, 7, 11, 13];
const GCODE = new Map(C.GODEL);
const gnNumber = word => word.reduce((n, sym, i) => n * BigInt(PRIMES[i]) ** BigInt(GCODE.get(sym)), 1n);
const group = n => (String(n).length < 5 ? String(n) : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '));   // 2430, pero 20 212 500
function scrGodel() {
  const s = ST.stage, enc = s.mode === 'enc', n = group(gnNumber(ST.word));
  const slots = ST.word.map((sym, i) => {
    const a = ST.ans[i], mk = ST.mark ? ST.mark[i] : '';
    const body = enc
      ? `<span class="gtop">${fm(sym)}</span><span class="gpow">${PRIMES[i]}<sup>${a == null ? '?' : a}</sup></span>`
      : `<span class="gpow">${PRIMES[i]}<sup>${GCODE.get(sym)}</sup></span><span class="gbot">${a == null ? '?' : fm(a)}</span>`;
    return `<button class="gslot${i === ST.cur && !ST.solved ? ' cur' : ''}${mk ? ' ' + mk : ''}" data-act="gslot" data-i="${i}" ${ST.solved ? 'disabled' : ''}>${body}</button>`;
  }).join('');
  const pal = C.GODEL.map(([sym, code]) => `<button class="key" data-act="gpick" data-v="${enc ? code : esc(sym)}" ${ST.solved ? 'disabled' : ''}>${enc ? code : fm(sym)}</button>`).join('');
  const filled = ST.ans.every(x => x != null);
  return `<div class="proof">
    <div class="goal panel"><span class="gtag">${enc ? 'CODIFICA' : 'DECODIFICA'}</span><span class="seq">${enc ? fm(ST.word.join('')) + (ST.solved ? ' = ' + n : '') : n + (ST.solved ? ' = ' + fm(ST.word.join('')) : '')}</span></div>
    <div class="cols">
      <div class="panel model gn">
        <div class="mlabel">CLAVE</div>
        <div class="tw"><table class="tbl gtab"><tbody><tr>${C.GODEL.map(([sym]) => `<td>${fm(sym)}</td>`).join('')}</tr><tr>${C.GODEL.map(([sym, code]) => `<td>${code}</td>`).join('')}</tr></tbody></table></div>
        <div class="mlabel">TU RESPUESTA</div>
        <div class="gslots">${slots}</div>
        <div class="gpal">${pal}</div>
      </div>
      <div class="side">${sayBox(ST.msg, true)}
        <div class="panel pal"><div class="acts">
          <button class="btn pri" data-act="gcheck" ${filled && !ST.solved ? '' : 'disabled'}>Comprobar</button>
          <button class="btn sm" data-act="gclear" ${ST.solved ? 'disabled' : ''}>Borrar todo</button></div>
          <p class="cap">Toca una posición y luego elige su valor.</p></div>
      </div>
    </div>
  </div>`;
}

const argKey = (prem, concl) => prem.map(L.str).sort().join(',') + '⊢' + L.str(concl);
const labEx = e => ({ prem: e[0].map(L.parse), concl: L.parse(e[1]), sys: e[3] });
/* en la máquina de un capítulo de tablas (mv: true) se usan las tablas aunque el sistema también tenga árboles */
const isMV = id => !!SEM.MV[id] && (!TB.SYS[id] || !!(ST && ST.stage && ST.stage.mv));
function scrLab() {

function labResult() {
  const r = ST.res;
  if (!r) return '';
  const [cls, icon, word] = r.v === 'valid' ? ['good', 'check', 'VÁLIDA'] : r.v === 'invalid' ? ['no', 'cross', 'INVÁLIDA'] : ['unk', 'quiz', 'SIN DECIDIR'];
  const cmp = r.cmp ? `<p class="vcmp">En la lógica clásica: <b class="${r.cmp === 'valid' ? 'good' : 'no'}">${r.cmp === 'valid' ? 'válida' : r.cmp === 'invalid' ? 'inválida' : 'sin decidir'}</b></p>` : '';
  let body = '';
  if (r.tab) body = `<div class="sheet treebox small">${treeHTML(r.tab, { still: true, openLeaf: r.open && r.open.id })}</div>` + (r.model ? modelHTML(r.tab.sys, r.model, ST.prem, ST.concl) : '');
  else if (r.mv && r.mv.model) body = `<div class="mlabel">CONTRAEJEMPLO${r.mv.model.dom ? ' · DOMINIO {' + r.mv.model.dom.join(', ') + '}' : ''}</div><div class="gats">${r.mv.model.atoms.map(a => `<span class="gat">${fm(a)} ${vchip2(ST.sys, r.mv.model.vals[a])}</span>`).join('')}</div>`;
  return `<div class="panel vres ${cls}"><div class="vverd">${ico(icon)}<span>${word}</span><small>${esc(sysName(ST.sys))}</small></div>${cmp}${body}</div>`;

function labSay(r) {
  if (isMV(ST.sys)) {
    if (r.v === 'valid' && r.how === 'dom') return `${r.upto === 1 ? 'Un dominio de un objeto no da' : 'Ningún dominio de uno a ' + (r.upto === 2 ? 'dos' : 'tres') + ' objetos da'} un contraejemplo (revisé ${r.rows} valuaciones en el último). Es un buen indicio, no una prueba: los dominios pueden ser infinitos.`;
    if (r.v === 'valid' && r.how === 'grid') return `Ninguna de las ${r.rows} valuaciones de la cuadrícula (de décimo en décimo) la refuta. Es un buen indicio de validez, aunque no una prueba: en L los valores son infinitos.`;
    if (r.v === 'valid') return `¡Válida! Revisé las ${r.rows} valuaciones: en ninguna las premisas son verdaderas y la conclusión no.`;
    if (r.v === 'invalid') return 'Inválida. Con estos valores las premisas son verdaderas y la conclusión no.';
    return 'Son demasiadas letras para revisar la tabla entera.';
  }
  if (r.v === 'valid') return `¡Válida! Todas las ramas del árbol se cerraron (${r.tab.nodes.length} líneas).`;
  if (r.v === 'invalid') return 'Inválida. Quedó una rama abierta y completa, y de ella sale este contramodelo.';
  return 'No pude decidirlo: el árbol crece sin cerrarse y no encontré una rama terminada. Con cuantificadores, o con reglas como η, los árboles pueden ser infinitos.';
}
function labGoals(r) {
  const s = ST.stage, got = ST.got, key = argKey(ST.prem, ST.concl);
  const ex = s.ex.some(e => { const x = labEx(e); return argKey(x.prem, x.concl) === key; });
  if (r.v === 'valid') got.valid = 1;
  if (r.v === 'invalid') got.invalid = 1;
  if (!ex && r.v !== 'unknown') got.own = 1;
  if (r.v !== 'unknown') { const seen = ST.seen[key] = ST.seen[key] || {}; seen[r.v] = 1; if (seen.valid && seen.invalid) got.split = 1; }
  if (r.v === 'invalid' && r.cmp === 'valid') got.gap = 1;
  if (!ST.solved && s.goals.every(g => got[g])) {
    ST.solved = true;
    finish(3);
    const mine = ST;
    setTimeout(() => { if (ST === mine && V.scr === 'stage') winModal(3, '¡BIEN!', 'Misiones cumplidas'); }, 1400);
  }
}
function runCheck(sys, prem, concl) {
  if (isMV(sys)) { const m = SEM.checkMV(sys, prem, concl, ST.stage.fo ? true : undefined); return { v: m.v, rows: m.rows, mv: m, how: m.how, upto: m.upto }; }
  const r = TB.solve(sys, prem, concl, 500);
  const out = { v: r.verdict, tab: r.t, open: r.open };
  if (r.open) out.model = TB.readModel(r.t, r.open);
  return out;
}
function labRun() {
  if (!ST.concl || ST.busy) return;
  ST.busy = true; ST.res = null;
  say('hint', 'Construyendo el árbol…');
  render();
  const mine = ST;
  setTimeout(() => {
    if (ST !== mine) return;
    const s = ST.stage;
    let r;
    try { r = runCheck(ST.sys, ST.prem, ST.concl); } catch (e) { r = { v: 'unknown' }; }
    /* para comparar con la clásica, ⊐ y → se leen como ⊃ */
    const toCl = f => (f.t === 'ico' || f.t === 'arr' ? L.Bin('imp', toCl(f.a), toCl(f.b)) : f.b ? L.Bin(f.t, toCl(f.a), toCl(f.b)) : f.a ? (f.t === 'all' || f.t === 'ex' ? L.Qf(f.t, f.v, toCl(f.a)) : L.Un(f.t, toCl(f.a))) : f);
    if (s.cmp) { try { r.cmp = runCheck(s.cmp, ST.prem.map(toCl), toCl(ST.concl)).v; } catch (e) { r.cmp = 'unknown'; } }
    ST.busy = false; ST.res = r;
    say(r.v === 'valid' ? 'ok' : 'hint', labSay(r));
    if (r.v === 'valid') sfx.ok(); else sfx.page();
    labGoals(r);
    render();
  }, 60);
}
function labSug() {
  const out = [], seen = new Set();
  ST.stage.ex.forEach(e => [...e[0], e[1]].forEach(x => { const f = L.parse(x), k = L.str(f); if (!seen.has(k)) { seen.add(k); out.push(f); } }));
  return out.slice(0, 10);
}
const labEdit = (title, put) => openFormula(title, labSug(), f => { closeModal(); put(f); ST.res = null; say('info', tx(ST.stage.intro)); sfx.ok(); render(); });

function alphabet() {
  const s = ST.stage, preds = new Set(), nm = new Set();
  const fs = [...ST.prem, ...(ST.concl ? [ST.concl] : []), ...labSug()];
  let fo = false;
  fs.forEach(f => L.subformulas(f).forEach(g => {
    if (g.t !== 'atom') return;
    if (g.args.length) { fo = true; if (g.p !== '=') preds.add(g.p); g.args.forEach(a => { if (L.isTerm(a)) nm.add(a); }); }
    else preds.add(g.p);
  }));
  const syms = [...(s.syms || '¬∧∨→')];
  if (syms.includes('∀')) fo = true;
  (fo ? 'FGR' : 'PQR').split('').forEach(c => preds.add(c));
  const terms = fo ? [...new Set([...nm, 'a', 'b'])].sort().concat(['x', 'y']) : [];

/* ---------- mando: cruceta, A, B, L, R, START y SELECT ---------- */
let padOn = false;
let padKey = null, padKeyApp = null, padClick = false;
const keyOf = e => Object.keys(e.dataset).sort().map(k => k + '=' + e.dataset[k]).join('&');
function padCands() {
  const rootEl = modal.hidden ? app : modal;
  return [...rootEl.querySelectorAll('button:not(:disabled)')].filter(e => e.offsetParent !== null && !e.classList.contains('locked'));
}
function padCur() { return padOn && padKey ? padCands().find(e => keyOf(e) === padKey) || null : null; }
function padShow() {
  document.querySelectorAll('.padf').forEach(e => e.classList.remove('padf'));
  const e = padCur();
  if (e) { e.classList.add('padf'); e.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
  return e;
}
function padDefault() {
  const c = padCands();
  return c.find(e => e.classList.contains('pri')) || c.find(e => !e.closest('.hud') && !e.closest('.tsnd')) || c[0] || null;
}
function padSet(e) { padOn = true; padKey = e ? keyOf(e) : null; padShow(); }
function padMove(dir) {
  const cur = padCur();
  if (!cur) { padSet(padDefault()); return; }
  const r0 = cur.getBoundingClientRect(), x0 = r0.left + r0.width / 2, y0 = r0.top + r0.height / 2;
  let best = null, bs = Infinity;
  padCands().forEach(e => {
    if (e === cur) return;
    const r = e.getBoundingClientRect(), dx = r.left + r.width / 2 - x0, dy = r.top + r.height / 2 - y0;
    const horiz = dir === 'left' || dir === 'right';
    const along = dir === 'left' ? -dx : dir === 'right' ? dx : dir === 'up' ? -dy : dy;
    if (along < 6) return;
    const overlap = horiz ? Math.min(r0.bottom, r.bottom) - Math.max(r0.top, r.top) : Math.min(r0.right, r.right) - Math.max(r0.left, r.left);
    const across = Math.abs(horiz ? dy : dx);
    const score = along + across * (overlap > 4 ? 0.4 : 2.6);
    if (score < bs) { bs = score; best = e; }
  });
  if (best) { padSet(best); sfx.sel(); }
}
function padPress(k) {
  AU.unlock();
  const inModal = !modal.hidden, T = V.scr === 'stage' && ST ? ST.type : '';
  if (k === 'up' || k === 'down' || k === 'left' || k === 'right') {
    if (!inModal && T === 'T' && (k === 'left' || k === 'right')) { ACT[k === 'left' ? 'tprev' : 'tnext'](); return; }
    padMove(k); return;
  }
  if (k === 'A') {
    if (!inModal && app.querySelector('.twh')) { twDone(); return; }
    const cur = padCur();
    if (cur) { padClick = true; try { cur.click(); } finally { padClick = false; } return; }
    if (!inModal && V.scr === 'title') { ACT.start(); return; }
    if (!inModal && T === 'T') { ACT.tnext(); return; }
    padSet(padDefault()); return;
  }
  if (k === 'B') {
    if (inModal) { if (modal.querySelector('.win')) ACT.toWorld(); else closeModal(); sfx.page(); return; }
    const back = app.querySelector('.hud [data-act]');
    if (back) { sfx.page(); back.click(); }
    return;
  }
  if (k === 'start') {
    if (inModal) { if (modal.querySelector('.snddlg')) closeModal(); return; }
    if (V.scr === 'title') ACT.start(); else if (T === 'A' && !ST.solved && !ST.playing) ACT.trule(); else openSound();
    return;
  }
  if (inModal) return;
  if (V.scr === 'map' || V.scr === 'world') {
    if (k === 'L' || k === 'R') {
      const w = V.w + (k === 'L' ? -1 : 1);
      if (V.scr === 'world' && w >= 0 && w < C.worlds.length && worldOpen(w)) { sfx.sel(); go('world', w); }
    }
    return;
  }
  if (T === 'T') { if (k === 'L') ACT.tprev(); if (k === 'R') ACT.tnext(); return; }
  if (T === 'A' && !ST.solved && !ST.playing) {
    if (k === 'L') ACT.undo();
    if (k === 'R') ACT.hint();
    if (k === 'select') openBook();
    return;
  }
  if (T === 'GN' && !ST.solved) {
    if (k === 'R' && ST.ans.every(x => x != null)) ACT.gcheck();
    if (k === 'select') ACT.gclear();
    return;
  }
  if (T === 'TT' && !ST.solved) {
    if (k === 'R' && ST.cells.every(col => col.every(x => x != null))) ACT.tcheck();
    if (k === 'select') ACT.tclear();
    return;
  }
  if (T === 'V' && !ST.busy) {
    if (k === 'R') labRun();
    if (k === 'select') ACT.vclear();
    if (k === 'L' && ST.stage.sys.length > 1) { const ss = ST.stage.sys; ACT.vsys({ x: ss[(ss.indexOf(ST.sys) + 1) % ss.length] }); }
    return;
  }

}
function legend() {

  const T = V.scr === 'stage' && ST ? ST.type : '';
  let items;
  if (!modal.hidden) items = [['A', 'elegir'], ['B', modal.querySelector('.win') ? 'etapas' : 'cerrar']];
  else if (V.scr === 'title') items = [['A', 'jugar'], ['START', 'jugar']];
  else if (V.scr === 'map') items = [['A', 'entrar'], ['B', 'portada'], ['START', 'volumen']];
  else if (V.scr === 'world') items = [['A', 'entrar'], ['B', 'mapa'], ['L R', 'otro mundo']];
  else if (T === 'T') items = [['A', 'seguir'], ['B', 'salir'], ['L R', 'página']];
  else if (T === 'A') items = [['A', 'elegir'], ['START', 'aplicar'], ['B', 'salir'], ['L', 'deshacer'], ['R', 'pista'], ['SELECT', 'reglas']];
  else if (T === 'TT') items = [['A', 'cambiar'], ['B', 'salir'], ['R', 'comprobar'], ['SELECT', 'borrar']];
  else if (T === 'GN') items = [['A', 'elegir'], ['B', 'salir'], ['R', 'comprobar'], ['SELECT', 'borrar']];
  else if (T === 'V') items = [['A', 'elegir'], ['B', 'salir'], ['R', 'construir'], ...(ST.stage.sys.length > 1 ? [['L', 'sistema']] : []), ['SELECT', 'vaciar']];
  else if (T === 'Q') items = [['A', 'elegir'], ['B', 'salir'], ['R', 'siguiente']];
  else items = [['A', 'elegir'], ['B', 'salir'], ['START', 'volumen']];
  el.innerHTML = items.map(([k, t]) => `<b>${k}</b> ${t}`).join(' · ');
}
document.querySelector('.pad').addEventListener('click', e => {
  const b = e.target.closest('[data-pad]');
  if (b) { padPress(b.dataset.pad); b.blur(); }
});
['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, () => AU.unlock(), true));
document.addEventListener('click', e => {
  if (e.target.closest('.pad')) return;
  if (!padClick && e.isTrusted && padOn) { padOn = false; padShow(); }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) { if (e.target === modal && !modal.querySelector('.win')) closeModal(); return; }
  const fn = ACT[b.dataset.act];
  if (fn) fn(b.dataset, b);
});
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key.toLowerCase() === 'z' && V.scr === 'stage' && ST.type === 'A' && modal.hidden) { e.preventDefault(); ACT.undo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const DIR = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }[e.key];
  if (DIR) { e.preventDefault(); padPress(DIR); return; }
  if (!modal.hidden && FD) {
    if (e.key === 'Escape') { closeModal(); return; }
    const al = FD.al;
    if (e.key === 'Enter') { e.preventDefault(); const cur = padCur(); if (cur) padPress('A'); else fdOK(); return; }
    if (e.key === 'Backspace') { e.preventDefault(); fdKey('bs'); return; }
    let k = KEYMAP[e.key];
    if (k && k !== '(' && k !== ')' && !al.syms.includes(k)) k = null;
    if (!k && /^[a-zA-Z]$/.test(e.key)) {
      if (al.preds.includes(e.key)) k = e.key;
      else if (al.terms.includes(e.key)) k = e.key;
    }
    if (k) { e.preventDefault(); fdKey(k); }
    return;
  }
  const onCtl = e.target.matches && e.target.matches('button');
  if ((e.key === 'Enter' || e.key === ' ') && onCtl) return;
  const PADKEY = { z: 'A', x: 'B', a: 'L', s: 'R', enter: 'start', backspace: 'select', escape: 'B' }[e.key.toLowerCase()];
  if (PADKEY) { e.preventDefault(); padPress(PADKEY); }
});

/* icono de pestaña */
try {
  if (PULPO.neutral) {
    const link = document.createElement('link');
    link.rel = 'icon'; link.href = PULPO.neutral.base;
    document.head.appendChild(link);
  }
} catch (e) { /* sin icono */ }

window.LogicaArboles = { go, render, state: () => ST, owl, save, act: ACT };
render();
})();

</script>
